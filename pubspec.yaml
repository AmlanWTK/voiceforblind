name: shuni
description: "Shuni (শুনি) — a voice-first learning app for blind and visually impaired children in Bangladesh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Bangla text-to-speech for prompts and confirmations.
  flutter_tts: ^4.2.5
  # One-shot Bangla speech recognition (Android SpeechRecognizer).
  speech_to_text: ^7.5.0
  # Plays the talking book's recorded narration (lessons and title clips).
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Generated by tools/build_daisy_catalog.py from the DAISY files below.
    - assets/library/
    # Class 1 — আমার বাংলা বই (NCTB), DAISY 3 talking book: narration MP3s,
    # pictures, text and navigation.
    - assets/AmarBanglaBoiClass1DaisyMultimedia/
    # Class 1 — English For Today (NCTB), DAISY 3 talking book, 5 units.
    - assets/EnglishClassOneDaisyMultimedia/
